[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Every host below is one the site actually talks to:
    #   apis.google.com / gstatic / *.firebaseapp.com  - Firebase Auth popup flow
    #   *.googleapis.com                               - Firestore, Auth token exchange
    #   youtube + ytimg                                - the video embeds and thumbnails
    #   w.soundcloud.com                               - the player iframe on the homepage
    # script-src keeps 'unsafe-inline' because Next.js ships inline hydration
    # scripts; removing it needs per-request nonces via middleware, which would
    # force every page dynamic. The rest of the policy still blocks injected
    # external scripts, framing, form hijacking and plugin content.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://img.youtube.com https://*.googleusercontent.com https://firebasestorage.googleapis.com https://storage.googleapis.com; font-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://firebasestorage.googleapis.com https://www.googleapis.com wss://*.firebaseio.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://w.soundcloud.com https://accounts.google.com https://ardenapp-d8ff5.firebaseapp.com; media-src 'self' https://w.soundcloud.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

# Hashed build output can be cached forever — the filename changes when the
# content does.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site images keep stable filenames, so they get a day of hard caching and a
# week of serving stale while a fresh copy is fetched behind the scenes. A
# replaced photo is live within a day rather than instantly, which is the right
# trade for assets that change once a year.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
